<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CineQ | Discover What to Watch & Smart Recommendations</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="assets/images/cineqFavicon.png?v=2" type="image/png" sizes="64x64" />
  <link rel="apple-touch-icon" href="assets/images/cineqFavicon.png" />
  <meta name="description" content="CineQ is an intelligent movie and TV series recommendation engine. Discover what to watch next with FlowMode, smart random suggestions, and manage your watchlist." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <!-- Use the existing CSS for aesthetics -->
  <link rel="stylesheet" href="assets/css/style.css?v=17">
  
  <style>
    /* Additional custom landing page styles */
    .landing-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
      color: var(--text-main);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    
    .landing-content {
      z-index: 10;
      max-width: 600px;
      animation: fadeInUp 0.8s ease-out;
    }

    .landing-title {
      font-family: var(--font-heading);
      font-size: 64px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--text-main) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .landing-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .landing-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 16px;
      padding: 16px 32px;
      border-radius: var(--radius-full);
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    
    .landing-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }
    
    .landing-cta i {
      margin-left: 8px;
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }
    
    .landing-cta:hover i {
      transform: translateX(4px);
    }

    .landing-features {
      display: flex;
      gap: 24px;
      margin-top: 64px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feature-item {
      background: var(--elevated);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Abstract background shapes */
    .glow-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 1;
      opacity: 0.15;
    }
    
    .glow-1 {
      width: 400px;
      height: 400px;
      background: var(--accent);
      top: -100px;
      left: -100px;
    }
    
    .glow-2 {
      width: 300px;
      height: 300px;
      background: #8b5cf6;
      bottom: -50px;
      right: -100px;
    }

    .landing-footer {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
      z-index: 10;
    }

    .landing-footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .landing-footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body class="dark-theme">
  <div class="landing-wrapper">
    <div class="glow-shape glow-1"></div>
    <div class="glow-shape glow-2"></div>
    
    <div class="landing-content">
      <img src="assets/images/cineqLogoDarkmode.png" alt="CineQ Logo" style="height: 48px; margin-bottom: 24px;" draggable="false" />
      <h1 class="landing-title">CineQ</h1>
      <p class="landing-subtitle">
        An elegant, ad-free movie and TV series tracker. <br />
        Discover personalized recommendations, manage your watchlist seamlessly, and coordinate release schedules with friends.
      </p>
      
      <a href="/app.html" class="landing-cta">
        Get Started <i data-lucide="arrow-right"></i>
      </a>

      <div class="landing-features">
        <div class="feature-item">
          <i data-lucide="film" style="color:var(--accent);"></i> Track Everything
        </div>
        <div class="feature-item">
          <i data-lucide="sparkles" style="color:#f59e0b;"></i> Smart Discover
        </div>
        <div class="feature-item">
          <i data-lucide="cloud" style="color:#3b82f6;"></i> Cloud Sync
        </div>
      </div>
    </div>
    
    <div class="landing-footer">
      <span>© 2026 CineQ</span>
      <span>•</span>
      <a href="/privacy.html" target="_blank">Privacy Policy</a>
      <span>•</span>
      <a href="/tos.html" target="_blank">Terms of Service</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    // Auto-detect if user has a light theme preference saved in localStorage
    try {
      const saved = localStorage.getItem('cineq_settings');
      if (saved) {
        const settings = JSON.parse(saved);
        if (settings.theme === 'light') {
          document.body.classList.replace('dark-theme', 'light-theme');
          document.querySelector('img[alt="CineQ Logo"]').src = 'assets/images/cineqLogoLightmode.png';
        }
      }
    } catch (e) {}
  </script>
</body>
</html>
